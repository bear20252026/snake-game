<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>贪吃蛇 · 深色圆角</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: #1e1f22; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 8px; }
    .game-container { background: #0f0f12; border-radius: 40px; padding: 18px 14px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.06); max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.03); }
    .score-area { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; color: #b5b9c2; font-weight: 500; font-size: 1.25rem; letter-spacing: 0.5px; }
    .score-item { background: #1e1f24; padding: 8px 20px; border-radius: 60px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 1px 1px rgba(255,255,255,0.03); display: flex; align-items: center; gap: 8px; }
    .score-item span:first-child { color: #7e8490; font-size: 1rem; }
    .score-item span:last-child { color: #e3e6ec; font-weight: 600; min-width: 2.5rem; text-align: right; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 28px; background: #15161a; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 10px 20px rgba(0,0,0,0.5); touch-action: none; }
    .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .dpad-row { display: flex; justify-content: center; gap: 18px; }
    .dpad-btn { background: #24262c; border: none; border-radius: 24px; width: 74px; height: 74px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 0 #0a0b0e, 0 12px 18px rgba(0,0,0,0.6); transition: all 0.05s ease; touch-action: manipulation; cursor: pointer; font-size: 2.4rem; color: #d0d5df; font-weight: 300; line-height: 1; border: 1px solid rgba(255,255,255,0.04); }
    .dpad-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #0a0b0e, 0 8px 12px rgba(0,0,0,0.5); background: #2f313a; }
    .restart-btn { background: #2a2d36; border: none; color: #ecedf2; font-size: 1.25rem; font-weight: 500; padding: 16px 10px; border-radius: 40px; margin-top: 8px; box-shadow: 0 6px 0 #0a0b0e, 0 10px 20px rgba(0,0,0,0.5); transition: all 0.06s ease; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a0b0e, 0 8px 16px rgba(0,0,0,0.5); background: #363a44; }
    .restart-btn svg { width: 22px; height: 22px; fill: #b5b9c2; }
    @media (max-aspect-ratio: 3/4) { .game-container { padding: 12px 10px 16px; border-radius: 32px; } .dpad-btn { width: 68px; height: 68px; font-size: 2.2rem; } }
    @media (max-height: 700px) { .dpad-btn { width: 64px; height: 64px; font-size: 2rem; } .restart-btn { padding: 12px; font-size: 1.1rem; } }
  </style>
</head>
<body>
<div class="game-container">
  <div class="score-area">
    <div class="score-item"><span>分数</span><span id="scoreDisplay">0</span></div>
    <div class="score-item"><span>最高</span><span id="highScoreDisplay">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <div class="dpad-row"><button class="dpad-btn" id="btnUp" aria-label="上">▲</button></div>
    <div class="dpad-row">
      <button class="dpad-btn" id="btnLeft" aria-label="左">◀</button>
      <button class="dpad-btn" id="btnDown" aria-label="下">▼</button>
      <button class="dpad-btn" id="btnRight" aria-label="右">▶</button>
    </div>
    <button class="restart-btn" id="restartButton">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
      重新开始
    </button>
  </div>
</div><script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const highScoreSpan = document.getElementById('highScoreDisplay');

    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 6, y: 10 };
    let direction = { dx: 1, dy: 0 };
    let nextDirection = { dx: 1, dy: 0 };
    let score = 0;
    let highScore = 0;
    let gameOver = false;
    let gameLoopInterval = null;
    const MOVE_INTERVAL_MS = 160;
    let pendingDirection = null;

    let touchStartX = 0, touchStartY = 0;
    let touchMoved = false;
    const SWIPE_THRESHOLD = 22;

    function loadHighScore() {
      try {
        const stored = localStorage.getItem('snake_highscore');
        highScore = stored ? (parseInt(stored, 10) || 0) : 0;
      } catch (e) { highScore = 0; }
      highScoreSpan.textContent = highScore;
    }

    function saveHighScore() {
      try { localStorage.setItem('snake_highscore', highScore.toString()); } catch (e) {}
    }

    function resetGame() {
      if (gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      direction = { dx: 1, dy: 0 };
      nextDirection = { dx: 1, dy: 0 };
      pendingDirection = null;
      score = 0;
      gameOver = false;
      updateScoreDisplay();
      generateFood();
      drawCanvas();
      gameLoopInterval = setInterval(gameTick, MOVE_INTERVAL_MS);
    }

    function updateScoreDisplay() {
      scoreSpan.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreSpan.textContent = highScore;
        saveHighScore();
      }
    }

    function generateFood() {
      for (let attempt = 0; attempt < 500; attempt++) {
        const randX = Math.floor(Math.random() * GRID_SIZE);
        const randY = Math.floor(Math.random() * GRID_SIZE);
        if (!snake.some(s => s.x === randX && s.y === randY)) { food = { x: randX, y: randY }; return; }
      }
      for (let y = 0; y < GRID_SIZE; y++)
        for (let x = 0; x < GRID_SIZE; x++)
          if (!snake.some(s => s.x === x && s.y === y)) { food = { x, y }; return; }
    }

    function gameTick() {
      if (gameOver) return;
      if (pendingDirection) {
        const canChange = !(direction.dx === -pendingDirection.dx && direction.dy === -pendingDirection.dy);
        if (canChange) direction = { dx: pendingDirection.dx, dy: pendingDirection.dy };
        pendingDirection = null;
      }
      const head = snake[0];
      const newHead = { x: head.x + direction.dx, y: head.y + direction.dy };
      const isEating = (newHead.x === food.x && newHead.y === food.y);
      snake.unshift(newHead);
      if (!isEating) {
        snake.pop();
      } else {
        score++;
        updateScoreDisplay();
        generateFood();
      }
      const headCollision =
        newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE ||
        snake.slice(1).some(s => s.x === newHead.x && s.y === newHead.y);
      if (headCollision) {
        gameOver = true;
        if (gameLoopInterval) { clearInterval(gameLoopInterval); gameLoopInterval = null; }
        drawCanvas();
        return;
      }
      drawCanvas();
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = i * CELL_SIZE;
        ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos); ctx.stroke();
      }

      ctx.shadowColor = '#f5a623';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f7b84a';
      const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
      ctx.beginPath(); ctx.arc(fx, fy, CELL_SIZE * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffe28c';
      ctx.beginPath(); ctx.arc(fx, fy, CELL_SIZE * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const x = seg.x * CELL_SIZE;
        const y = seg.y * CELL_SIZE;
        const padding = 1.5;
        const radius = 6;
        if (i === 0) {
          ctx.fillStyle = '#67d96b';
          ctx.shadowColor = '#4caf50';
          ctx.shadowBlur = 12;
        } else {
          const ratio = i / snake.length;
          const r = 40 + 40 * (1 - ratio);
          const g = 120 + 70 * (1 - ratio);
          ctx.fillStyle = 'rgb(' + r + ',' + g + ',40)';
          ctx.shadowColor = '#2e7d32';
          ctx.shadowBlur = 6;
        }
        ctx.beginPath();
        ctx.roundRect(x + padding, y + padding, CELL_SIZE - padding*2, CELL_SIZE - padding*2, radius);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 26px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 10;
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
        ctx.font = '18px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ccccdd';
        ctx.fillText('点击重新开始', canvas.width/2, canvas.height/2 + 30);
        ctx.shadowBlur = 0;
      }
    }

    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };

    function setDirection(dx, dy) {
      if (gameOver) return;
      if (direction.dx === -dx && direction.dy === -dy) return;
      if (direction.dx === dx && direction.dy === dy) return;
      pendingDirection = { dx, dy };
    }

    function handleTouchStart(e) {
      e.preventDefault();
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY; touchMoved = false;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (touchMoved || gameOver) return;
      if (!touchStartX && !touchStartY) return;
      const t = e.touches[0];
      const deltaX = t.clientX - touchStartX;
      const deltaY = t.clientY - touchStartY;
      if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) return;
      touchMoved = true;
      if (Math.abs(deltaX) > Math.abs(deltaY)) setDirection(deltaX > 0 ? 1 : -1, 0);
      else setDirection(0, deltaY > 0 ? 1 : -1);
      touchStartX = t.clientX; touchStartY = t.clientY;
      setTimeout(() => { touchMoved = false; }, 80);
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      touchStartX = 0; touchStartY = 0; touchMoved = false;
    }

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    document.getElementById('btnUp').addEventListener('click', (e) => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('click', (e) => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('click', (e) => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('click', (e) => { e.preventDefault(); setDirection(1, 0); });
    document.getElementById('restartButton').addEventListener('click', (e) => { e.preventDefault(); resetGame(); });

    window.addEventListener('keydown', (e) => {
      if (gameOver) return;
      const k = e.key;
      e.preventDefault();
      if (k === 'ArrowUp' || k === 'w' || k === 'W') setDirection(0, -1);
      else if (k === 'ArrowDown' || k === 's' || k === 'S') setDirection(0, 1);
      else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDirection(-1, 0);
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDirection(1, 0);
      else if (k === ' ') resetGame();
    });

    loadHighScore();
    resetGame();
  })();
</script>
</body>
</html>
